<header
  class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-border-default bg-bg-surface px-4 py-3 sm:px-6"
  data-testid="header"
>
  <a routerLink="/" class="flex items-center gap-1" data-testid="header-logo-link">
    <span class="text-xl font-extrabold tracking-tight text-text-primary">RentifyX</span>
    <span class="h-2 w-2 rounded-sm bg-brand-default"></span>
  </a>

  <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
    @if (isAuthenticated() && !isRestoringSession()) {
      @if (isAdmin()) {
        <a
          routerLink="/admin/categories"
          class="text-sm font-medium text-text-secondary hover:text-text-primary"
          data-testid="header-admin-categories-link"
        >
          {{ 'header.adminCategoriesLink' | translate }}
        </a>
        <a
          routerLink="/admin/review"
          class="text-sm font-medium text-text-secondary hover:text-text-primary"
          data-testid="header-admin-review-link"
        >
          {{ 'header.adminReviewLink' | translate }}
        </a>
      }
      <a
        routerLink="/account"
        class="text-sm font-medium text-text-secondary hover:text-text-primary"
        data-testid="header-account-link"
      >
        {{ 'header.accountLink' | translate }}
      </a>
      <button
        type="button"
        (click)="logout()"
        class="rounded-md border border-border-strong px-4 py-2 text-sm font-semibold text-text-primary hover:bg-bg-canvas"
        data-testid="header-logout-button"
      >
        {{ 'header.logoutButton' | translate }}
      </button>
    } @else {
      <a
        routerLink="/login"
        class="text-sm font-medium text-text-secondary hover:text-text-primary"
        data-testid="header-login-link"
      >
        {{ 'header.loginLink' | translate }}
      </a>
      <a
        routerLink="/register"
        class="rounded-md bg-brand-default px-4 py-2 text-sm font-semibold text-brand-foreground hover:bg-brand-hover"
        data-testid="header-register-link"
      >
        {{ 'header.registerLink' | translate }}
      </a>
    }

    <label class="sr-only" for="header-language-select">{{ 'header.languageLabel' | translate }}</label>
    <select
      id="header-language-select"
      class="rounded-md border border-border-default bg-bg-surface px-2 py-1.5 text-sm text-text-primary"
      data-testid="header-language-select"
      [value]="currentLanguage()"
      (change)="onLanguageChange($event)"
    >
      @for (language of supportedLanguages; track language) {
        <option [value]="language">{{ language }}</option>
      }
    </select>
  </div>
</header>
